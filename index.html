<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Horse Looker 4000</title>
    <link rel="stylesheet" href="src/styles.css" />
  </head>
  <body>
    <main class="game">
      <div class="viewport">
        <canvas id="pasture" aria-label="Pasture"></canvas>
        <div class="vignette" aria-hidden="true"></div>
        <div id="zoom-readout" class="zoom-readout" aria-live="polite">×1.0</div>
      </div>
      <footer id="strip" class="strip" aria-label="Progress"></footer>
    </main>
    <div id="screen" class="screen" role="status" aria-live="polite"></div>
    <script type="module" src="src/main.js"></script>
  </body>
</html>
